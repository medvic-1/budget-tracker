<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --purple: #a855f7;
      --border: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .card h3 {
      margin: 0 0 8px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card p {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .breakdown-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .donut-chart {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #334155;
      position: relative;
      flex-shrink: 0;
    }

    .donut-hole {
      position: absolute;
      inset: 22px;
      background: var(--card-bg);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .legend {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .legend-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .form-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    input, select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .list-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Budget Tracker</h1>

    <!-- Summary Metrics -->
    <div class="dashboard">
      <div class="card">
        <h3>Total Balance</h3>
        <p id="total-balance">$0.00</p>
      </div>
      <div class="card">
        <h3>Income</h3>
        <p style="color: var(--green);" id="total-income">$0.00</p>
      </div>
      <div class="card">
        <h3>Expenses</h3>
        <p style="color: var(--red);" id="total-expenses">$0.00</p>
      </div>
    </div>

    <!-- Spending Breakdown Donut Chart -->
    <div class="breakdown-card">
      <div class="donut-chart" id="donut-bg">
        <div class="donut-hole">
          <span>SPEND</span>
        </div>
      </div>
      <div class="legend" id="category-legend">
        <span style="color: var(--text-muted);">No expenses recorded yet.</span>
      </div>
    </div>

    <!-- Add Transaction Form -->
    <div class="form-card">
      <form id="transaction-form">
        <div class="form-row">
          <input type="text" id="title" placeholder="Transaction Title" required>
          <input type="number" step="0.01" id="amount" placeholder="Amount (+ inc, - exp)" required>
        </div>
        <div class="form-row">
          <select id="category">
            <option value="Food">Food</option>
            <option value="Rent">Rent</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <button type="submit">Add Item</button>
        </div>
      </form>
    </div>

    <!-- Transaction History -->
    <div class="list-card">
      <h3>Recent Activity</h3>
      <ul id="transaction-list"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
