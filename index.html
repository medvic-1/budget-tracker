<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --border: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .card h3 {
      margin: 0 0 8px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card p {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .form-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    form {
      display: flex;
      gap: 12px;
    }

    input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      flex: 1;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .list-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Budget Tracker</h1>

    <div class="dashboard">
      <div class="card">
        <h3>Total Balance</h3>
        <p id="total-balance">$0.00</p>
      </div>
      <div class="card">
        <h3>Income</h3>
        <p style="color: var(--green);" id="total-income">$0.00</p>
      </div>
      <div class="card">
        <h3>Expenses</h3>
        <p style="color: var(--red);" id="total-expenses">$0.00</p>
      </div>
    </div>

    <div class="form-card">
      <form id="transaction-form">
        <input type="text" id="title" placeholder="Transaction Title" required>
        <input type="number" step="0.01" id="amount" placeholder="Amount (+ inc, - exp)" required>
        <button type="submit">Add Item</button>
      </form>
    </div>

    <div class="list-card">
      <h3>Recent Activity</h3>
      <ul id="transaction-list"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
